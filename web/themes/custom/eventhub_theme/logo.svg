<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3cac"></stop>
      <stop offset="100%" stop-color="#ffe53b"></stop>
    </linearGradient>

    <radialGradient id="gradGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#1b1b3a" stop-opacity="1"></stop>
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <rect width="100%" height="100%" fill="url(#gradGlow)"></rect>

  <!-- Map Pin -->
  <path d="M400 100
           C300 100 240 180 240 260
           C240 360 400 500 400 500
           C400 500 560 360 560 260
           C560 180 500 100 400 100Z" fill="#111" stroke="#ffb347" stroke-width="6"></path>

  <!-- DJ Circle -->
  <circle cx="400" cy="260" r="120" fill="#222" stroke="#fff" stroke-width="4"></circle>

  <!-- Light beams -->
  <polygon points="400,260 300,120 340,120" fill="#ff3cac" opacity="0.6"></polygon>
  <polygon points="400,260 460,120 500,120" fill="#ffe53b" opacity="0.6"></polygon>
  <polygon points="400,260 380,120 420,120" fill="#4facfe" opacity="0.6"></polygon>

  <!-- DJ -->
  <rect x="350" y="250" width="100" height="30" rx="6" fill="#000"></rect>
  <circle cx="400" cy="225" r="18" fill="#000"></circle>

  <!-- Crowd -->
  <g fill="#000">
    <circle cx="320" cy="320" r="14"></circle>
    <circle cx="350" cy="330" r="16"></circle>
    <circle cx="390" cy="335" r="18"></circle>
    <circle cx="430" cy="330" r="16"></circle>
    <circle cx="470" cy="320" r="14"></circle>
  </g>

  <!-- Text background -->
  <rect x="200" y="500" width="400" height="70" rx="20" fill="#111" stroke="#fff" stroke-width="3"></rect>

  <!-- Text -->
  <text x="400" y="550" text-anchor="middle" font-size="64" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="url(#gradText)">
    EventHub
  </text>
</svg>
