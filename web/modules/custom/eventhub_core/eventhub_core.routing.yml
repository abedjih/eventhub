eventhub.geodata_autocomplete:
  path: '/api/eventhub/geodata/autocomplete'
  defaults:
    _controller: '\Drupal\eventhub_core\Controller\GeoDataController::autocomplete'
  requirements:
    _permission: 'create event'

eventhub.event.toggle_status:
  path: '/event/{event}/toggle-status'
  defaults:
    _controller: '\Drupal\eventhub_core\Controller\EventController::toggleStatus'
  requirements:
    _permission: 'edit any event'
    _csrf_token: 'TRUE'

entity.event.settings:
  path: 'admin/structure/event'
  defaults:
    _form: '\Drupal\eventhub_core\Form\EventSettingsForm'
    _title: 'Event'
  requirements:
    _permission: 'administer event'

