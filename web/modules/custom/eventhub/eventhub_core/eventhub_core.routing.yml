eventhub.event_list:
  path: '/events'
  defaults:
    _controller: '\Drupal\eventhub_core\Controller\EventController::list'
    _title: 'Événements'
  requirements:
    _permission: 'access content'

eventhub.event_view:
  path: '/event/{event}'
  defaults:
    _controller: '\Drupal\eventhub_core\Controller\EventController::view'
    _title: 'Événement'
  requirements:
    _permission: 'access content'
  options:
    parameters:
      event:
        type: entity:event

eventhub.event_edit:
  path: '/event/{event}/edit'
  defaults:
    _form: '\Drupal\eventhub_core\Form\EventEditForm'
    _title: 'Modifier l''événement'
  requirements:
    _entity_access: event.update
  options:
    parameters:
      event:
        type: entity:event

eventhub.event_delete:
  path: '/event/{event}/delete'
  defaults:
    _form: '\Drupal\eventhub_core\Form\EventDeleteForm'
    _title: 'Supprimer l''événement'
  requirements:
    _entity_access: event.delete
  options:
    parameters:
      event:
        type: entity:event

eventhub.event_create:
  path: '/event/create'
  defaults:
    _form: '\Drupal\eventhub_core\Form\EventForm'
    _title: 'Créer un événement'
  requirements:
    _permission: 'create event'

eventhub.registration_create:
  path: '/event/{event}/register'
  defaults:
    _form: '\Drupal\eventhub_core\Form\RegistrationForm'
    _title: 'Inscription'
  requirements:
    _permission: 'register to event'
  options:
    parameters:
      event:
        type: entity:event

eventhub.event_registrations:
  path: '/event/{event}/registrations'
  defaults:
    _controller: '\Drupal\eventhub_core\Controller\RegistrationController::listForEvent'
    _title: 'Inscriptions'
  requirements:
    _permission: 'view event registrations'
  options:
    parameters:
      event:
        type: entity:event

eventhub.registration_cancel:
  path: '/registration/{registration}/cancel'
  defaults:
    _controller: '\Drupal\eventhub_core\Controller\RegistrationController::cancel'
    _title: 'Annuler l''inscription'
  requirements:
    _permission: 'register to event'
    _csrf_token: 'TRUE'
  options:
    parameters:
      registration:
        type: entity:registration

eventhub.admin_settings:
  path: '/admin/config/eventhub/settings'
  defaults:
    _form: '\Drupal\eventhub_core\Form\EventHubSettingsForm'
    _title: 'Configuration EventHub'
  requirements:
    _permission: 'administer eventhub'

eventhub.dashboard:
  path: '/admin/eventhub/dashboard'
  defaults:
    _controller: '\Drupal\eventhub_core\Controller\EventController::dashboard'
    _title: 'Tableau de bord EventHub'
  requirements:
    _permission: 'administer eventhub'

eventhub.geodata_autocomplete:
  path: '/api/eventhub/geodata/autocomplete'
  defaults:
    _controller: '\Drupal\eventhub_core\Controller\GeoDataController::autocomplete'
  requirements:
    _permission: 'create event'
